<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ClickFocus Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #26324d 0%, #101522 45%, #080b12 100%);
      color: #ffffff;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .card {
      background: rgba(24, 31, 48, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    p {
      color: #b8c1d6;
      line-height: 1.6;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 24px;
    }

    .hidden {
      display: none !important;
    }

    button,
    select,
    input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .primary-button {
      width: 100%;
      background: #4f8cff;
      color: white;
      font-weight: bold;
    }

    .secondary-button {
      background: #303b55;
      color: white;
    }

    .danger-button {
      background: #d94c5c;
      color: white;
    }

    .google-button {
      background: white;
      color: #202124;
      width: 100%;
      font-weight: bold;
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .user-photo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #303b55;
    }

    .user-name {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-email {
      color: #9da9c1;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer-card {
      text-align: center;
    }

    .timer-label {
      color: #aeb9d0;
      margin-bottom: 10px;
    }

    .timer {
      font-size: clamp(54px, 14vw, 100px);
      font-weight: bold;
      letter-spacing: 3px;
      margin: 12px 0 24px;
      color: #ffffff;
    }

    .timer.active {
      color: #62e6a8;
    }

    .timer.finished {
      color: #ff7785;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dbe2f2;
      font-weight: bold;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      color: white;
      background: #101827;
      border: 1px solid #34415d;
      border-radius: 10px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #4f8cff;
    }

    .custom-time-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .custom-time-row input {
      flex: 1;
    }

    .unit-label {
      color: #aeb9d0;
      white-space: nowrap;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .button-row button {
      flex: 1;
    }

    .status {
      min-height: 24px;
      margin-top: 12px;
      color: #aeb9d0;
      font-size: 14px;
    }

    .status.success {
      color: #62e6a8;
    }

    .status.error {
      color: #ff7785;
    }

    .site-form {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .site-form input {
      flex: 1;
    }

    .site-form button {
      white-space: nowrap;
    }

    .sites-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .site-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      background: #101827;
      border: 1px solid #293650;
      border-radius: 10px;
    }

    .site-name {
      overflow-wrap: anywhere;
      color: #e9eefb;
    }

    .site-delete-button {
      flex-shrink: 0;
      padding: 8px 12px;
      background: #3a2531;
      color: #ff9ba6;
      border-radius: 8px;
    }

    .empty-state {
      padding: 18px;
      text-align: center;
      color: #8f9bb3;
      background: #101827;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      color: #aeb9d0;
      padding: 20px;
    }

    .note {
      font-size: 13px;
      color: #8f9bb3;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 18px;
        border-radius: 16px;
      }

      .user-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .button-row,
      .site-form {
        flex-direction: column;
      }

      .site-form button {
        width: 100%;
      }

      .site-item {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <section class="card" id="loginSection">
      <h1>ClickFocus</h1>
      <p class="subtitle">
        ניהול זמן ריכוז וחסימת הסחות דעת
      </p>

      <button id="googleLoginButton" class="google-button">
        התחברות עם Google
      </button>

      <div id="loginStatus" class="status"></div>
    </section>

    <section id="appSection" class="hidden">

      <div class="card">
        <div class="user-bar">
          <div class="user-info">
            <img
              id="userPhoto"
              class="user-photo"
              src=""
              alt="תמונת משתמש"
            />

            <div>
              <div id="userName" class="user-name"></div>
              <div id="userEmail" class="user-email"></div>
            </div>
          </div>

          <button id="logoutButton" class="secondary-button">
            התנתקות
          </button>
        </div>

        <h1>לוח הבקרה</h1>
        <p class="subtitle">
          הגדר את זמן הריכוז שלך והתחל לעבוד ללא הסחות דעת.
        </p>
      </div>

      <section class="card timer-card">
        <div class="timer-label">זמן שנותר</div>

        <div id="timerDisplay" class="timer">
          00:00:00
        </div>

        <div class="form-group">
          <label for="durationSelect">
            בחירת זמן ריכוז
          </label>

          <select id="durationSelect">
            <option value="30">30 דקות</option>
            <option value="60">60 דקות</option>
            <option value="120">120 דקות</option>
            <option value="custom">זמן מותאם אישית</option>
          </select>
        </div>

        <div id="customTimeContainer" class="form-group hidden">
          <label for="customDurationInput">
            זמן מותאם אישית
          </label>

          <div class="custom-time-row">
            <input
              id="customDurationInput"
              type="number"
              min="1"
              max="1440"
              step="1"
              placeholder="לדוגמה: 45"
            />

            <span class="unit-label">דקות</span>
          </div>
        </div>

        <div class="button-row">
          <button id="startButton" class="primary-button">
            התחל טיימר
          </button>

          <button id="stopButton" class="danger-button">
            עצור טיימר
          </button>
        </div>

        <div id="timerStatus" class="status"></div>
      </section>

      <section class="card">
        <h2>אתרים חסומים</h2>

        <p>
          הוסף אתרים שתרצה לחסום בזמן מצב ריכוז.
        </p>

        <form id="siteForm" class="site-form">
          <input
            id="siteInput"
            type="text"
            placeholder="לדוגמה: youtube.com"
            autocomplete="off"
          />

          <button type="submit" class="primary-button">
            הוסף אתר
          </button>
        </form>

        <div id="sitesStatus" class="status"></div>

        <div id="sitesList" class="sites-list">
          <div class="loading">
            טוען רשימת אתרים...
          </div>
        </div>

        <p class="note">
          כרגע הרשימה נשמרת בחשבון שלך. חסימה בפועל תתווסף בשלב הבא.
        </p>
      </section>

    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
