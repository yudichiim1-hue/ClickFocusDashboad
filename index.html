<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClickFocus</title>

<style>
body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

.card {
    background:#222;
    padding:30px;
    margin:50px auto;
    border-radius:20px;
    width:300px;
}

button, select {
    width:90%;
    padding:15px;
    margin:10px;
    border-radius:10px;
    border:0;
    font-size:16px;
}

button {
    cursor:pointer;
}

#status {
    font-size:22px;
}

#timer {
    font-size:20px;
    color:#00ff88;
}
</style>

</head>


<body>


<h1>🎯 ClickFocus</h1>


<div class="card">


<h2>מצב פוקוס</h2>


<p id="status">
טוען...
</p>


<p id="timer"></p>



<button onclick="startFocus()">
🟢 הפעל פוקוס
</button>



<button onclick="stopFocus()">
🔴 כבה פוקוס
</button>



<hr>



<h3>
⏱️ זמן פוקוס
</h3>



<select id="focusTime">

<option value="30">
30 דקות
</option>


<option value="60" selected>
שעה
</option>


<option value="120">
שעתיים
</option>


<option value="180">
3 שעות
</option>


</select>



<button id="startTimer">
🚀 הפעל לזמן נבחר
</button>



</div>



<script type="module" src="app.js"></script>


</body>

</html>
