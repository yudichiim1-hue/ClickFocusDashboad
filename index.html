<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClickFocus</title>

<style>
body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

.card {
    background:#222;
    padding:25px;
    margin:50px auto;
    border-radius:20px;
    width:300px;
}

button, select {
    width:90%;
    padding:15px;
    margin:10px;
    border-radius:10px;
    border:0;
    font-size:18px;
}

.start {
    background:#4caf50;
}

.stop {
    background:#f44336;
    color:white;
}

#timer {
    font-size:35px;
    margin:20px;
}
</style>
</head>

<body>

<h2>🎯 ClickFocus</h2>

<div class="card">

<h3>מצב פוקוס</h3>

<div id="status">כבוי</div>

<select id="time">
<option value="30">30 דקות</option>
<option value="60">שעה</option>
<option value="120">שעתיים</option>
</select>

<div id="timer">
00:00
</div>

<button class="start" onclick="startFocus()">
🟢 הפעל פוקוס
</button>

<button class="stop" onclick="stopFocus()">
🔴 כבה פוקוס
</button>

</div>


<script type="module" src="app.js"></script>

</body>
</html>
