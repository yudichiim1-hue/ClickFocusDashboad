<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>ClickFocus Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎯 ClickFocus</h1>

<div class="card">

<h2>מצב פוקוס</h2>

<p id="status">
טוען...
</p>


<button onclick="startFocus()">
🟢 הפעל פוקוס
</button>


<button onclick="stopFocus()">
🔴 כבה פוקוס
</button>


<hr>


<h3>⏱️ בחירת זמן</h3>


<select id="focusTime">

<option value="30">
30 דקות
</option>

<option value="60" selected>
שעה
</option>

<option value="120">
שעתיים
</option>

<option value="180">
3 שעות
</option>

</select>


<button id="startTimer">
🚀 הפעל לזמן נבחר
</button>


</div>


<script type="module" src="app.js"></script>

</body>
</html>
