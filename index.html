<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClickFocus</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

.card{

background:#222;
padding:25px;
margin:30px auto;
border-radius:20px;
width:330px;

}

button,input,select{

width:90%;
padding:12px;
margin:8px;
border-radius:10px;
border:0;
font-size:16px;

}


.start{
background:#4caf50;
}


.stop{

background:#f44336;
color:white;

}


.site{

background:#333;
padding:10px;
margin:5px;
border-radius:10px;

}


#timer{

font-size:35px;
margin:20px;

}


</style>

</head>


<body>


<h2>🎯 ClickFocus</h2>


<div class="card">


<h3>⏱️ פוקוס</h3>


<div id="status">
כבוי
</div>


<select id="time">

<option value="30">
30 דקות
</option>

<option value="60">
שעה
</option>

<option value="120">
שעתיים
</option>

<option value="180">
3 שעות
</option>

</select>


<input
id="customTime"
type="number"
placeholder="זמן מותאם בדקות"
>



<div id="timer">
00:00
</div>


<button class="start" onclick="startFocus()">
🟢 הפעל
</button>


<button class="start" onclick="startCustomFocus()">
⏱️ זמן מותאם
</button>


<button class="stop" onclick="stopFocus()">
🔴 כבה
</button>


<hr>


<h3>🚫 אתרים חסומים</h3>


<input
id="siteInput"
placeholder="youtube.com"
>


<button onclick="addSite()">
➕ הוסף אתר
</button>


<div id="sitesList">
טוען...
</div>



</div>


<script type="module" src="app.js"></script>


</body>

</html>
