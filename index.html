<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClickFocus</title>

<style>
body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

.card {
    background:#222;
    padding:25px;
    margin:50px auto;
    border-radius:20px;
    width:300px;
}

button, select {
    width:90%;
    padding:15px;
    margin:10px;
    border-radius:10px;
    border:0;
    font-size:18px;
    cursor: pointer;
}

.start { background:#4caf50; color:white; }
.stop { background:#f44336; color:white; }
.login { background:#4285F4; color:white; }
.logout { background:#555; color:white; margin-top: 20px; }

#timer {
    font-size:35px;
    margin:20px;
}

/* הסתרת אלמנטים כברירת מחדל */
#app-section { display: none; }
</style>
</head>

<body>

<h2>🎯 ClickFocus</h2>

<!-- אזור התחברות -->
<div id="login-section" class="card">
    <h3>ברוך הבא!</h3>
    <p>התחבר כדי לסנכרן את הפוקוס שלך</p>
    <button class="login" onclick="loginWithGoogle()">
        🔵 התחבר עם Google
    </button>
</div>

<!-- אזור האפליקציה (יוסתר עד ההתחברות) -->
<div id="app-section" class="card">
    <h3>מצב פוקוס</h3>
    <div id="status">כבוי</div>

    <select id="time">
        <option value="30">30 דקות</option>
        <option value="60">שעה</option>
        <option value="120">שעתיים</option>
    </select>

    <div id="timer">00:00</div>

    <button class="start" onclick="startFocus()">🟢 הפעל פוקוס</button>
    <button class="stop" onclick="stopFocus()">🔴 כבה פוקוס</button>
    
    <button class="logout" onclick="logoutUser()">🚪 התנתק</button>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
